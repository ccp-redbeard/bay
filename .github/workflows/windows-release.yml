# Builds and tests bay on Windows for a release of this fork, then attaches the binary.
# Upstream bay has no hosted CI (AGENTS.md); this file belongs to the fork only.
#
# The Windows jobs run on the runner the repository variable WINDOWS_RUNNER names (a label, or
# a JSON list of labels), else on windows-latest. Nothing here runs for a pull request.
name: windows-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (empty builds the branch, attaches nothing)
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  REF: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ startsWith(vars.WINDOWS_RUNNER, '[') && fromJSON(vars.WINDOWS_RUNNER) || vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets

      - name: Unit tests and doctests, sha1 objects and files refs
        run: |
          cargo test --lib --bins
          cargo test --doc

      - name: Unit tests and doctests, sha256 objects and reftable refs
        env:
          BAY_TEST_FORMATS: sha256/reftable
        run: |
          cargo test --lib --bins
          cargo test --doc

  # The integration suite takes hours on one Windows machine, so it runs in shards: each takes
  # every SHARDS-th test file, in name order.
  integration:
    runs-on: ${{ startsWith(vars.WINDOWS_RUNNER, '[') && fromJSON(vars.WINDOWS_RUNNER) || vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARDS: 8
      SHARD: ${{ matrix.shard }}
      # A hosted runner's TEMP is an 8.3 short path (RUNNER~1); the tests compare the paths
      # they make with the long ones Git and bay report, so they work under the runner's own.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      # The integration tests start their fake `#!/bin/sh` programs through this shim.
      - name: Test shim
        run: cargo build --example sh_shim

      - name: Integration tests, shard ${{ matrix.shard }} of 8
        shell: pwsh
        run: |
          $listed = cargo test --test it -- --list --format terse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = $listed | Where-Object { $_ -match ': test$' } |
            ForEach-Object { ($_ -replace ': test$', '').Split('::')[0] } | Sort-Object -Unique
          $mine = @(for ($i = [int]$env:SHARD; $i -lt $files.Count; $i += [int]$env:SHARDS) { "$($files[$i])::" })
          "shard $env:SHARD runs $($mine.Count) of $($files.Count) test files"
          cargo test --test it -- --test-threads 4 @mine

  build:
    needs: [check, integration]
    runs-on: ${{ startsWith(vars.WINDOWS_RUNNER, '[') && fromJSON(vars.WINDOWS_RUNNER) || vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Release build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/bay.exe dist/bay-x86_64-pc-windows-msvc.exe
          (cd dist && sha256sum bay-x86_64-pc-windows-msvc.exe > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: bay-windows
          path: dist/

  # Only this job may write, and it runs no code from the repository.
  attach:
    needs: build
    if: github.event.release.tag_name != '' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bay-windows
          path: dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
